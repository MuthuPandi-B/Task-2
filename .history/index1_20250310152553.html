<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              Blue: "#083F9B",
              Purple: "#7F56D9",
              White: "#FFFFFF",
              Textblue: "#0E38CD",
              Textgray: "#4F547B",
              Numblue: "#0094E7",
              bgblue: "#D9ECFF",
              bgwhite: "#F0F3FF",
              Textblack: "#000000",
            },
          },
        },
      };
    </script>
    <title>Askmeindenty</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
  </head>
  <body class="bg-bgwhite">
    <header class="bg-White">
      <nav class="container mx-auto flex flex-wrap items-center justify-between p-4">
        <div class="w-1/2 md:w-1/4">
          <img src="Assets/Askmeidentitytop.png" alt="Logo" />
        </div>
        <button class="md:hidden text-2xl"><i class="fas fa-bars"></i></button>
        <ul class="hidden md:flex md:gap-6 font-Righteous text-sm">
          <li>Home</li>
          <li>About</li>
          <li>Courses</li>
          <li>Contact</li>
        </ul>
        <div class="hidden md:flex items-center gap-4">
          <img src="Assets/Carticon.png" alt="Cart" class="w-6 h-6" />
          <li class="font-Saira underline px-4 py-2">Login</li>
          <li class="font-Saira px-4 py-2 rounded-md bg-gradient-to-r from-Blue to-Purple text-white">
            Signup
          </li>
        </div>
      </nav>
      
      <section class="bg-gradient-to-r from-Purple to-Blue p-6 text-center md:text-left">
        <div class="container mx-auto flex flex-col md:flex-row items-center justify-between">
          <div class="w-full md:w-1/2">
            <p class="text-sm uppercase text-white">Successful coaches are visionaries</p>
            <h1 class="text-white text-3xl md:text-6xl py-4">
              Good <span class="text-Textblue">coaching</span> is <br /> good teaching & <br /> nothing else.
            </h1>
            <ul class="mt-4 flex flex-col md:flex-row gap-3">
              <li class="px-4 py-2 border rounded-md text-white">View Courses</li>
              <li class="px-4 py-2 text-white">Get Free Consultation</li>
            </ul>
            <div class="bg-white mt-6 p-2 rounded-lg flex items-center shadow-lg">
              <input
                type="text"
                placeholder="What do you want to learn today?"
                class="flex-grow p-2 text-Textgray rounded-l-lg focus:outline-none"
              />
              <button class="bg-gradient-to-r from-Blue to-Purple text-white px-4 py-2 rounded-lg">Search</button>
            </div>
          </div>
          <div class="w-full md:w-1/2 mt-6 md:mt-0 flex justify-center">
            <img src="Assets/brunette-woman-hugging-laptop_1-removebg-preview.png" alt="Hero" class="w-2/3 md:w-auto" />
          </div>
        </div>
      </section>
    </header>

    <section class="bg-gradient-to-t from-bgblue to-bgwhite py-10">
      <div class="container mx-auto text-center">
        <h1 class="font-Rowdies text-xl md:text-2xl">
          Featured <span class="text-Textblue">Course</span>
        </h1>
        <p class="text-sm md:text-base text-Textblack">
          The feature courses are we invented our teaching part
        </p>
      </div>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 px-4 md:px-20 mt-6">
        <img src="Assets/Course1.png" alt="Course 1" />
        <img src="Assets/Course2.png" alt="Course 2" />
        <img src="Assets/Course3 (2).png" alt="Course 3" />
        <img src="Assets/Course4 (2).png" alt="Course 4" />
        <img src="Assets/Course5.png" alt="Course 5" />
        <img src="Assets/Clourse6.png" alt="Course 6" />
      </div>
      
      <div class="flex justify-center mt-6">
        <button class="bg-gradient-to-r from-Blue to-Purple px-6 py-2 rounded-md text-white">
          Explore Courses
        </button>
      </div>
    </section>
  </body>
</html>
